name: Build one plugin

# Central orchestrator: clone a DirektDSP plugin, build every format per-OS,
# render the unified installer from templates/, compile it (NSIS on Windows,
# productbuild .pkg on macOS, zip on Linux), checksum + smoke-test, and upload
# installer artifacts. build-all.yml calls this once per plugin and then
# publishes the aggregate catalog + download site.
#
# Invoked via workflow_call (from build-all.yml) or manually (workflow_dispatch)
# to (re)build a single plugin.

on:
  workflow_call:
    inputs:
      plugin:
        description: manifest slug (e.g. polygraph)
        required: true
        type: string
      ref:
        description: override plugin git ref (tag/branch/sha); blank = manifest/default
        required: false
        type: string
        default: ""
      level:
        # build    - compile + unit tests + installers (the original behavior)
        # validate - + lint gate, pluginval, clapval
        # full     - + sanitizers, coverage, benchmarks, user manual
        description: "quality level: build | validate | full"
        required: false
        type: string
        default: validate
    secrets:
      PAT: { required: true }
      PLUGIN_CONFIG_B64: { required: false }
      # macOS signing + notarization. All optional and independently gated: with
      # none set the pkg builds unsigned exactly as before, so the pipeline stays
      # green before the certificates exist. Define these once as DirektDSP
      # *organization* secrets and every plugin inherits them.
      MACOS_INSTALLER_SIGN_IDENTITY: { required: false }
      MACOS_SIGN_IDENTITY_APP: { required: false }
      MACOS_CERT_APPLICATION_P12: { required: false }
      MACOS_CERT_APPLICATION_PASSWORD: { required: false }
      MACOS_CERT_INSTALLER_P12: { required: false }
      MACOS_CERT_INSTALLER_PASSWORD: { required: false }
      MACOS_KEYCHAIN_PASSWORD: { required: false }
      MACOS_NOTARY_KEY_P8: { required: false }
      MACOS_NOTARY_KEY_ID: { required: false }
      MACOS_NOTARY_ISSUER_ID: { required: false }
  workflow_dispatch:
    inputs:
      plugin:
        description: manifest slug (e.g. polygraph)
        required: true
        type: string
      ref:
        description: override plugin git ref
        required: false
        type: string
        default: ""
      level:
        description: quality level
        required: false
        type: choice
        options: [build, validate, full]
        default: validate

env:
  BUILD_TYPE: Release

jobs:
  # --------------------------------------------------------------------------
  # Read the manifest once; every downstream job consumes these outputs.
  # --------------------------------------------------------------------------
  manifest:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.m.outputs.slug }}
      repo_name: ${{ steps.m.outputs.repo_name }}
      ref: ${{ steps.ref.outputs.ref }}
      product_name: ${{ steps.m.outputs.product_name }}
      product_slug: ${{ steps.m.outputs.product_slug }}
      company_name: ${{ steps.m.outputs.company_name }}
      bundle_id: ${{ steps.m.outputs.bundle_id }}
      needs_plugin_template: ${{ steps.m.outputs.needs_plugin_template }}
      build_dir: ${{ steps.m.outputs.build_dir }}
      artefacts_subdir: ${{ steps.m.outputs.artefacts_subdir }}
      disable_moonbase_flag: ${{ steps.m.outputs.disable_moonbase_flag }}
      sanitizer_flag: ${{ steps.m.outputs.sanitizer_flag }}
      config_secret: ${{ steps.m.outputs.config_secret }}
      has_tests: ${{ steps.m.outputs.has_tests }}
      windows_targets: ${{ steps.m.outputs.windows_targets }}
      macos_targets: ${{ steps.m.outputs.macos_targets }}
      linux_targets: ${{ steps.m.outputs.linux_targets }}
      windows_runtime_files: ${{ steps.m.outputs.windows_runtime_files }}
      linux_runtime_files: ${{ steps.m.outputs.linux_runtime_files }}
      level: ${{ steps.level.outputs.level }}
    steps:
      - name: Checkout generator
        uses: actions/checkout@v4
      - name: Read manifest
        id: m
        run: python3 tools/manifest_ci.py github-output "${{ inputs.plugin }}" >> "$GITHUB_OUTPUT"
      - name: Resolve plugin ref
        id: ref
        run: |
          REF="${{ inputs.ref }}"
          [ -z "$REF" ] && REF="${{ steps.m.outputs.ref }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Resolve quality level
        id: level
        run: |
          LEVEL="${{ inputs.level }}"
          case "$LEVEL" in build|validate|full) ;; *) LEVEL=validate ;; esac
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "quality level: $LEVEL"

  # --------------------------------------------------------------------------
  # Lint gate (level >= validate): typos + clang-format + clang-tidy. Each
  # tool runs only when the plugin ships its config — legacy plugins skip
  # with a notice instead of failing. Build jobs wait on this so a lint
  # failure aborts the run before paid runners spin up.
  # --------------------------------------------------------------------------
  lint:
    needs: manifest
    if: contains(fromJSON('["validate","full"]'), needs.manifest.outputs.level)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.manifest.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/${{ needs.manifest.outputs.repo_name }}
          ref: ${{ needs.manifest.outputs.ref }}
          path: ${{ needs.manifest.outputs.repo_name }}
          submodules: recursive
          token: ${{ secrets.PAT }}
      - name: Clone PluginTemplate (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/PluginTemplate
          path: PluginTemplate
          submodules: recursive
          token: ${{ secrets.PAT }}
      # Shared GUI base (look/ + display/DirektCurveEditor) — the spectral lineup
      # resolves ../DirektDSP_GUI as a sibling; cheap no-op for plugins that
      # don't reference it, so it rides the same gate as PluginTemplate.
      - name: Clone DirektDSP_GUI (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/DirektDSP_GUI
          path: DirektDSP_GUI
          token: ${{ secrets.PAT }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build jq \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxfixes-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libcurl4-openssl-dev \
            ladspa-sdk libgl1-mesa-dev \
            clang clang-tidy
      - name: Check spelling (typos)
        run: |
          if [ ! -f typos.toml ]; then
            echo "::notice::no typos.toml — skipping spelling check"; exit 0
          fi
          curl -fsSL "https://github.com/crate-ci/typos/releases/download/v1.47.2/typos-v1.47.2-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin ./typos
          typos --config typos.toml
      - name: Check formatting (clang-format)
        run: |
          if [ ! -f .clang-format ] || [ ! -d source ]; then
            echo "::notice::no .clang-format (or no source/) — skipping format check"; exit 0
          fi
          find source -name "*.cpp" -o -name "*.h" | \
            xargs -r clang-format --dry-run --Werror
      - name: Run clang-tidy
        env:
          DISABLE_FLAG: ${{ needs.manifest.outputs.disable_moonbase_flag }}
        run: |
          if [ ! -f .clang-tidy ] || [ ! -d source ]; then
            echo "::notice::no .clang-tidy (or no source/) — skipping static analysis"; exit 0
          fi
          cmake -B build-lint -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            ${DISABLE_FLAG:+-D${DISABLE_FLAG}=ON}
          # Generate BinaryData.h (juce_add_binary_data "Assets" target) so that
          # non-UI TUs which transitively include it (PluginProcessor.cpp ->
          # PluginEditor.h -> LookAndFeel.h -> BinaryData.h) parse under tidy.
          # Best-effort: plugins without an Assets target just skip it.
          cmake --build build-lint --target Assets >/dev/null 2>&1 || true
          # Exclude UI + editor translation units themselves from analysis.
          find source -name "*.cpp" | grep -v "/UI/" | grep -v "PluginEditor" | \
            xargs -r clang-tidy \
              -p build-lint \
              --config-file=.clang-tidy \
              2>&1 | tee clang-tidy.log
          if grep -q "error:" clang-tidy.log; then
            echo "::error::clang-tidy reported errors — see log above"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # User manual (level=full, or any v* tag ref): LaTeX -> PDF, embedded into
  # the installers by the build jobs. Plugins without docs/manual skip.
  # --------------------------------------------------------------------------
  build-manual:
    needs: manifest
    if: needs.manifest.outputs.level == 'full' || startsWith(needs.manifest.outputs.ref, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.manifest.outputs.repo_name }}
    steps:
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/${{ needs.manifest.outputs.repo_name }}
          ref: ${{ needs.manifest.outputs.ref }}
          path: ${{ needs.manifest.outputs.repo_name }}
          token: ${{ secrets.PAT }}
      - name: Probe for manual
        id: probe
        run: |
          if [ -x docs/manual/build.sh ] || [ -f docs/manual/build.sh ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no docs/manual/build.sh — skipping manual"
          fi
      - name: Install TeX Live
        if: steps.probe.outputs.found == 'true'
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-luatex latexmk
      - name: Build manual PDF
        if: steps.probe.outputs.found == 'true'
        run: |
          chmod +x docs/manual/build.sh
          docs/manual/build.sh
      - name: Upload manual PDF
        if: steps.probe.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-manual
          path: ${{ needs.manifest.outputs.repo_name }}/docs/manual/build/*.pdf
          retention-days: 30

  # --------------------------------------------------------------------------
  # Linux build (always). Produces VST3/CLAP/Standalone bundles + runs tests.
  # --------------------------------------------------------------------------
  build-linux:
    needs: [manifest, lint, build-manual]
    # Run whenever the manifest resolved, tolerating skipped quality jobs
    # (level=build), a failed manual (installer ships without the PDF), and a
    # failed lint — lint is advisory; a spelling/format finding must not sink
    # installers or the quality suite (same philosophy as publish).
    if: >-
      always() && needs.manifest.result == 'success' &&
      needs.lint.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/${{ needs.manifest.outputs.repo_name }}
          ref: ${{ needs.manifest.outputs.ref }}
          path: ${{ needs.manifest.outputs.repo_name }}
          submodules: recursive
          token: ${{ secrets.PAT }}
      - name: Clone PluginTemplate (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/PluginTemplate
          path: PluginTemplate
          submodules: recursive
          token: ${{ secrets.PAT }}
      # Shared GUI base (look/ + display/DirektCurveEditor) — the spectral lineup
      # resolves ../DirektDSP_GUI as a sibling; cheap no-op for plugins that
      # don't reference it, so it rides the same gate as PluginTemplate.
      - name: Clone DirektDSP_GUI (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/DirektDSP_GUI
          path: DirektDSP_GUI
          token: ${{ secrets.PAT }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build jq \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxfixes-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libcurl4-openssl-dev \
            ladspa-sdk libgl1-mesa-dev
      - name: Recreate moonbase config
        # secrets.* is NOT available in step-level if:, so gate inside the script
        # on the env var (env CAN read secrets). A blank secret is a no-op.
        # workflow_call passes PLUGIN_CONFIG_B64; manual dispatch falls back to
        # the per-plugin repo secret named by the manifest (config_secret).
        id: mbconfig
        env:
          PLUGIN_CONFIG_B64: ${{ secrets.PLUGIN_CONFIG_B64 || secrets[needs.manifest.outputs.config_secret] }}
          DISABLE_FLAG: ${{ needs.manifest.outputs.disable_moonbase_flag }}
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: |
          if [ -n "$PLUGIN_CONFIG_B64" ]; then
            mkdir -p assets
            echo "$PLUGIN_CONFIG_B64" | base64 --decode > assets/moonbase_api_config.json
            echo "moonbase config written"
            echo "cmake_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "no config secret — building with Moonbase disabled"
            echo "cmake_flags=${DISABLE_FLAG:+-D${DISABLE_FLAG}=ON}" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: cmake -B "${{ needs.manifest.outputs.build_dir }}" -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ steps.mbconfig.outputs.cmake_flags }}
      - name: Build
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: cmake --build "${{ needs.manifest.outputs.build_dir }}" --config ${{ env.BUILD_TYPE }} --target ${{ needs.manifest.outputs.linux_targets }}
      - name: Test
        if: needs.manifest.outputs.has_tests == 'true'
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: ctest --test-dir "${{ needs.manifest.outputs.build_dir }}" --output-on-failure -C ${{ env.BUILD_TYPE }} -E "Benchmarks"
      - name: Read version
        id: version
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: |
          if [[ "${{ needs.manifest.outputs.ref }}" == v* ]]; then V="${{ needs.manifest.outputs.ref }}"; V="${V#v}";
          elif [ -f VERSION ]; then V="$(cat VERSION)"; else V="0.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Collect artifacts
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        env:
          RUNTIME_FILES: ${{ needs.manifest.outputs.linux_runtime_files }}
        run: |
          mkdir -p ../_artifacts/linux
          base="${{ needs.manifest.outputs.build_dir }}/${{ needs.manifest.outputs.artefacts_subdir }}/${{ env.BUILD_TYPE }}"
          [ -d "$base/VST3" ] && cp -r "$base/VST3/"*.vst3 ../_artifacts/linux/ || true
          [ -d "$base/CLAP" ] && cp -r "$base/CLAP/"*.clap ../_artifacts/linux/ || true
          [ -d "$base/Standalone" ] && cp -r "$base/Standalone/"* ../_artifacts/linux/ || true
          # [runtime_files].linux: companions of the single-file formats (e.g. a
          # shared library + Licenses). The plugin loader looks next to the module
          # first, so they go in the same directory as the .clap and the standalone
          # binary: the zip root. CLAP/ and Standalone/ normally hold identical
          # copies; refuse to silently overwrite differing ones. A no-op for
          # plugins without the table (RUNTIME_FILES is empty).
          for dir in CLAP Standalone; do
            [ -d "$base/$dir" ] || continue
            for item in $RUNTIME_FILES; do
              item="${item%/}"
              if [ ! -e "$base/$dir/$item" ]; then
                echo "::warning::runtime file '$item' not found in $base/$dir (neural/runtime features will be missing from this zip)"
                continue
              fi
              if [ -e "../_artifacts/linux/$item" ] && ! diff -rq "$base/$dir/$item" "../_artifacts/linux/$item" > /dev/null; then
                echo "::error::runtime file '$item' differs between CLAP/ and Standalone/; they must sit in one directory in the zip"
                exit 1
              fi
              cp -rL "$base/$dir/$item" ../_artifacts/linux/
            done
          done
          ls -laR ../_artifacts/linux/
      - name: Upload raw plugin bundles (for validators)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-raw-linux
          path: _artifacts/linux/
          retention-days: 7
      - name: Download manual PDF (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-manual
          path: _artifacts/linux
      - name: Linux install notes (plugins with runtime files)
        if: needs.manifest.outputs.linux_runtime_files != ''
        run: |
          python3 _generator/tools/render_installer.py "${{ needs.manifest.outputs.slug }}" \
            --linux-readme _artifacts/linux/LINUX-INSTALL.txt
      - name: Package Linux zip
        run: |
          cd _artifacts/linux
          zip -qr "../${{ needs.manifest.outputs.product_slug }}-${{ steps.version.outputs.version }}-Linux.zip" .
          cd ..
          for f in *-Linux.zip; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-linux
          path: |
            _artifacts/*-Linux.zip
            _artifacts/*-Linux.zip.sha256
          retention-days: 7

  # --------------------------------------------------------------------------
  # Windows build + NSIS installer.
  # --------------------------------------------------------------------------
  build-windows:
    needs: [manifest, lint, build-manual]
    if: >-
      always() && needs.manifest.result == 'success' &&
      needs.lint.result != 'cancelled'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/${{ needs.manifest.outputs.repo_name }}
          ref: ${{ needs.manifest.outputs.ref }}
          path: ${{ needs.manifest.outputs.repo_name }}
          submodules: recursive
          token: ${{ secrets.PAT }}
      - name: Clone PluginTemplate (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/PluginTemplate
          path: PluginTemplate
          submodules: recursive
          token: ${{ secrets.PAT }}
      # Shared GUI base (look/ + display/DirektCurveEditor) — the spectral lineup
      # resolves ../DirektDSP_GUI as a sibling; cheap no-op for plugins that
      # don't reference it, so it rides the same gate as PluginTemplate.
      - name: Clone DirektDSP_GUI (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/DirektDSP_GUI
          path: DirektDSP_GUI
          token: ${{ secrets.PAT }}
      - name: Recreate moonbase config
        # secrets.* is NOT available in step-level if:, so gate inside the script.
        # workflow_call passes PLUGIN_CONFIG_B64; manual dispatch falls back to
        # the per-plugin repo secret named by the manifest (config_secret).
        id: mbconfig
        shell: bash
        env:
          PLUGIN_CONFIG_B64: ${{ secrets.PLUGIN_CONFIG_B64 || secrets[needs.manifest.outputs.config_secret] }}
          DISABLE_FLAG: ${{ needs.manifest.outputs.disable_moonbase_flag }}
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: |
          if [ -n "$PLUGIN_CONFIG_B64" ]; then
            mkdir -p assets
            echo "$PLUGIN_CONFIG_B64" | base64 --decode > assets/moonbase_api_config.json
            echo "moonbase config written"
            echo "cmake_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "no config secret — building with Moonbase disabled"
            echo "cmake_flags=${DISABLE_FLAG:+-D${DISABLE_FLAG}=ON}" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: cmake -B "${{ needs.manifest.outputs.build_dir }}" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ steps.mbconfig.outputs.cmake_flags }}
      - name: Build
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: cmake --build "${{ needs.manifest.outputs.build_dir }}" --config ${{ env.BUILD_TYPE }} --parallel 4 --target ${{ needs.manifest.outputs.windows_targets }}
      - name: Test
        if: needs.manifest.outputs.has_tests == 'true'
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: ctest --test-dir "${{ needs.manifest.outputs.build_dir }}" --output-on-failure -C ${{ env.BUILD_TYPE }} -E "Benchmarks"
      - name: Collect artifacts
        shell: bash
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        env:
          RUNTIME_FILES: ${{ needs.manifest.outputs.windows_runtime_files }}
        run: |
          mkdir -p ../_artifacts/windows
          base="${{ needs.manifest.outputs.build_dir }}/${{ needs.manifest.outputs.artefacts_subdir }}/${{ env.BUILD_TYPE }}"
          [ -d "$base/VST3" ] && cp -r "$base/VST3/"*.vst3 ../_artifacts/windows/ || true
          [ -d "$base/CLAP" ] && cp "$base/CLAP/"*.clap ../_artifacts/windows/ || true
          [ -d "$base/Standalone" ] && cp "$base/Standalone/"*.exe ../_artifacts/windows/ || true
          # [runtime_files].windows: companions that must sit beside the .clap and
          # the standalone .exe (e.g. a DLL + Licenses). Staged in clap/ and
          # standalone/ subfolders so the two copies can't collide; the NSIS
          # template installs each next to its format. A no-op for plugins without
          # the table (RUNTIME_FILES is empty).
          for pair in CLAP:clap Standalone:standalone; do
            src="$base/${pair%%:*}"
            dst="../_artifacts/windows/${pair##*:}"
            [ -d "$src" ] || continue
            for item in $RUNTIME_FILES; do
              item="${item%/}"
              if [ -e "$src/$item" ]; then
                mkdir -p "$dst"
                cp -rL "$src/$item" "$dst/"
              else
                echo "::warning::runtime file '$item' not found in $src (the installer will skip it)"
              fi
            done
          done
          ls -laR ../_artifacts/windows/
      - name: Upload raw plugin bundles (for validators)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-raw-windows
          path: _artifacts/windows/
          retention-days: 7
      - name: Download manual PDF (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-manual
          path: _artifacts/windows
      - name: Render installer from template
        shell: bash
        run: |
          python3 _generator/tools/render_installer.py "${{ needs.manifest.outputs.slug }}" \
            --plugin-dir "${{ needs.manifest.outputs.repo_name }}"
      - name: Ensure NSIS brand assets
        shell: pwsh
        run: |
          $pkg   = "${{ needs.manifest.outputs.repo_name }}/packaging"
          $house = "_generator/templates/assets"
          # Fall back to the generic DirektDSP house assets (icon/header/welcome)
          # for anything the plugin doesn't ship its own art for. These are real
          # company-branded assets — never another plugin's art.
          if (-not (Test-Path "$pkg/icon.png"))    { Copy-Item "$house/icon.png"    "$pkg/icon.png" }
          if (-not (Test-Path "$pkg/header.bmp"))  { Copy-Item "$house/header.bmp"  "$pkg/header.bmp" }
          if (-not (Test-Path "$pkg/welcome.bmp")) { Copy-Item "$house/welcome.bmp" "$pkg/welcome.bmp" }
          # Windows installer icon: derive .ico from whichever icon.png is in place.
          if (-not (Test-Path "$pkg/icon.ico")) {
            choco install imagemagick.tool --yes --no-progress
            magick "$pkg/icon.png" -define icon:auto-resize=256,64,48,32,16 "$pkg/icon.ico"
          }
      - name: Read version
        id: version
        shell: bash
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: |
          if [[ "${{ needs.manifest.outputs.ref }}" == v* ]]; then V="${{ needs.manifest.outputs.ref }}"; V="${V#v}";
          elif [ -f VERSION ]; then V="$(cat VERSION)"; else V="0.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      # `choco install` exits 0 when the community feed is unreachable — it
      # reports "Chocolatey installed 0/0 packages" and returns success. That
      # turned a transient 503 into a green install step followed by
      # makensis-action failing with "Unable to find makensis executable",
      # which reads like a pathing bug and is not one. Retry the fetch, then
      # assert the binary actually exists before moving on.
      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dirs = @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS")

          function Find-MakeNSIS {
            foreach ($d in $dirs) {
              $exe = Join-Path $d "makensis.exe"
              if (Test-Path $exe) { return $d }
            }
            return $null
          }

          for ($i = 1; $i -le 3; $i++) {
            if (Find-MakeNSIS) { break }
            Write-Host "::group::choco install nsis (attempt $i/3)"
            choco install nsis --yes --no-progress
            Write-Host "::endgroup::"
            if (Find-MakeNSIS) { break }
            if ($i -lt 3) { Start-Sleep -Seconds (10 * $i) }
          }

          $found = Find-MakeNSIS
          if (-not $found) {
            throw "makensis.exe not found after 3 attempts. Chocolatey likely could not reach the package feed - check the group output above for a 5xx from community.chocolatey.org."
          }
          Write-Host "makensis.exe found in $found"
          # makensis-action searches PATH first; make sure it is there regardless
          # of whether choco's shim landed in this session's environment.
          Add-Content -Path $env:GITHUB_PATH -Value $found
      - name: Build NSIS installer
        uses: joncloud/makensis-action@v4
        with:
          script-file: ${{ needs.manifest.outputs.repo_name }}/packaging/installer.nsi
          arguments: >-
            /DVERSION=${{ steps.version.outputs.version }}
            /DARTIFACTS_DIR=${{ github.workspace }}\_artifacts\windows
            /DOUTDIR=${{ github.workspace }}\_artifacts
      - name: Smoke test + checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem _artifacts -Filter "*-Windows.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "no installer produced"; exit 1 }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit $($p.ExitCode)"; exit 1 }
          $vst3 = Join-Path $env:CommonProgramFiles "VST3\${{ needs.manifest.outputs.company_name }}\${{ needs.manifest.outputs.product_name }}.vst3"
          if (-not (Test-Path $vst3)) { Write-Error "VST3 not installed at $vst3"; exit 1 }
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $exe.Name | Out-File "$($exe.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-windows
          path: |
            _artifacts/*-Windows.exe
            _artifacts/*-Windows.exe.sha256
          retention-days: 7

  # --------------------------------------------------------------------------
  # macOS build (universal) + .pkg installer.
  # --------------------------------------------------------------------------
  build-macos:
    needs: [manifest, lint, build-manual]
    if: >-
      always() && needs.manifest.result == 'success' &&
      needs.lint.result != 'cancelled'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/${{ needs.manifest.outputs.repo_name }}
          ref: ${{ needs.manifest.outputs.ref }}
          path: ${{ needs.manifest.outputs.repo_name }}
          submodules: recursive
          token: ${{ secrets.PAT }}
      - name: Clone PluginTemplate (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/PluginTemplate
          path: PluginTemplate
          submodules: recursive
          token: ${{ secrets.PAT }}
      # Shared GUI base (look/ + display/DirektCurveEditor) — the spectral lineup
      # resolves ../DirektDSP_GUI as a sibling; cheap no-op for plugins that
      # don't reference it, so it rides the same gate as PluginTemplate.
      - name: Clone DirektDSP_GUI (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/DirektDSP_GUI
          path: DirektDSP_GUI
          token: ${{ secrets.PAT }}
      - name: Install deps
        run: brew install ninja jq
      - name: Recreate moonbase config
        # secrets.* is NOT available in step-level if:, so gate inside the script.
        # workflow_call passes PLUGIN_CONFIG_B64; manual dispatch falls back to
        # the per-plugin repo secret named by the manifest (config_secret).
        id: mbconfig
        env:
          PLUGIN_CONFIG_B64: ${{ secrets.PLUGIN_CONFIG_B64 || secrets[needs.manifest.outputs.config_secret] }}
          DISABLE_FLAG: ${{ needs.manifest.outputs.disable_moonbase_flag }}
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: |
          if [ -n "$PLUGIN_CONFIG_B64" ]; then
            mkdir -p assets
            echo "$PLUGIN_CONFIG_B64" | base64 --decode > assets/moonbase_api_config.json
            echo "moonbase config written"
            echo "cmake_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "no config secret — building with Moonbase disabled"
            echo "cmake_flags=${DISABLE_FLAG:+-D${DISABLE_FLAG}=ON}" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: cmake -B "${{ needs.manifest.outputs.build_dir }}" -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" ${{ steps.mbconfig.outputs.cmake_flags }}
      - name: Build
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: cmake --build "${{ needs.manifest.outputs.build_dir }}" --config ${{ env.BUILD_TYPE }} --target ${{ needs.manifest.outputs.macos_targets }}
      - name: Test
        if: needs.manifest.outputs.has_tests == 'true'
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: ctest --test-dir "${{ needs.manifest.outputs.build_dir }}" --output-on-failure -C ${{ env.BUILD_TYPE }} -E "Benchmarks"
      - name: Collect artifacts
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: |
          mkdir -p ../_artifacts/macos
          base="${{ needs.manifest.outputs.build_dir }}/${{ needs.manifest.outputs.artefacts_subdir }}/${{ env.BUILD_TYPE }}"
          [ -d "$base/VST3" ] && cp -r "$base/VST3/"*.vst3 ../_artifacts/macos/ || true
          [ -d "$base/CLAP" ] && cp -R "$base/CLAP/"*.clap ../_artifacts/macos/ || true
          [ -d "$base/AU" ] && cp -r "$base/AU/"*.component ../_artifacts/macos/ || true
          [ -d "$base/Standalone" ] && cp -r "$base/Standalone/"*.app ../_artifacts/macos/ || true
          ls -laR ../_artifacts/macos/
      - name: Upload raw plugin bundles (for validators)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-raw-macos
          path: _artifacts/macos/
          retention-days: 7
      - name: Download manual PDF (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-manual
          path: _artifacts/macos
      - name: Render installer from template
        run: |
          python3 _generator/tools/render_installer.py "${{ needs.manifest.outputs.slug }}" \
            --plugin-dir "${{ needs.manifest.outputs.repo_name }}"
      - name: Read version
        id: version
        working-directory: ${{ needs.manifest.outputs.repo_name }}
        run: |
          if [[ "${{ needs.manifest.outputs.ref }}" == v* ]]; then V="${{ needs.manifest.outputs.ref }}"; V="${V#v}";
          elif [ -f VERSION ]; then V="$(cat VERSION)"; else V="0.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      # Certificates go into a throwaway keychain, never the runner's login one.
      # Skipped wholesale when the secrets are absent, which leaves the pkg
      # unsigned and the build green.
      - name: Import signing certificates
        id: keychain
        env:
          CERT_APP: ${{ secrets.MACOS_CERT_APPLICATION_P12 }}
          CERT_INSTALLER: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
          CERT_APP_PASSWORD: ${{ secrets.MACOS_CERT_APPLICATION_PASSWORD }}
          CERT_INSTALLER_PASSWORD: ${{ secrets.MACOS_CERT_INSTALLER_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Guarded here rather than in `if:` — a step's own env block is not
          # reliably available to that step's own condition.
          if [ -z "$CERT_APP" ]; then
            echo "No signing certificate configured — skipping keychain setup."
            exit 0
          fi
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::error::MACOS_CERT_APPLICATION_P12 is set but MACOS_KEYCHAIN_PASSWORD is not"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Default 5-minute auto-lock will expire mid-notarization otherwise
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_APP" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" \
            -P "$CERT_APP_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          if [ -n "$CERT_INSTALLER" ]; then
            echo "$CERT_INSTALLER" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" \
              -P "$CERT_INSTALLER_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security
          fi
          rm -f "$RUNNER_TEMP"/*.p12

          # Without this, codesign blocks on an interactive keychain prompt that
          # nobody can answer and the job sits there until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Keep login.keychain in the search list; notarytool reads from it.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Leaves the output empty when no key is configured, which build_pkg.sh
      # reads as "skip notarization".
      - name: Write notary API key
        id: notary
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$NOTARY_KEY" ]; then
            echo "No notary key configured — skipping notarization."
            exit 0
          fi
          if [ -z "${{ secrets.MACOS_NOTARY_KEY_ID }}" ] || [ -z "${{ secrets.MACOS_NOTARY_ISSUER_ID }}" ]; then
            echo "::error::MACOS_NOTARY_KEY_P8 is set but MACOS_NOTARY_KEY_ID / MACOS_NOTARY_ISSUER_ID are not — set all three"
            exit 1
          fi
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          echo "path=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"

      - name: Build .pkg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACTS_DIR: ${{ github.workspace }}/_artifacts/macos
          OUTDIR: ${{ github.workspace }}/_artifacts
          PRODUCT_NAME: ${{ needs.manifest.outputs.product_name }}
          PRODUCT_SLUG: ${{ needs.manifest.outputs.product_slug }}
          BUNDLE_ID: ${{ needs.manifest.outputs.bundle_id }}
          COMPANY_NAME: ${{ needs.manifest.outputs.company_name }}
          MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
          MACOS_SIGN_IDENTITY_APP: ${{ secrets.MACOS_SIGN_IDENTITY_APP }}
          MACOS_ENTITLEMENTS: ${{ github.workspace }}/${{ needs.manifest.outputs.repo_name }}/packaging/macos/standalone.entitlements
          NOTARY_KEY_PATH: ${{ steps.notary.outputs.path }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        # notarytool --wait blocks on Apple's queue: usually ~2 min, occasionally
        # much longer, so this needs far more headroom than an unsigned build.
        timeout-minutes: 45
        run: bash "${{ needs.manifest.outputs.repo_name }}/packaging/macos/build_pkg.sh"

      - name: Smoke test + checksum
        env:
          EXPECT_SIGNED: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY != '' }}
          # All-or-nothing, matching build_pkg.sh: a partial notary config
          # skips notarization there, so it must not demand a ticket here.
          EXPECT_NOTARIZED: ${{ secrets.MACOS_NOTARY_KEY_P8 != '' && secrets.MACOS_NOTARY_KEY_ID != '' && secrets.MACOS_NOTARY_ISSUER_ID != '' }}
        run: |
          set -euo pipefail
          PKG=$(ls _artifacts/*-macOS.pkg | head -1)
          [ -n "$PKG" ] || { echo "no pkg produced"; exit 1; }

          xar -tf "$PKG" | grep -qi "${{ needs.manifest.outputs.product_name }}.vst3.pkg" || { echo "::error::pkg missing VST3 sub-package"; exit 1; }

          # Once the certs exist these are hard failures, not warnings — a
          # silently-unsigned release is the exact thing this pipeline is for.
          if [ "$EXPECT_SIGNED" = "true" ]; then
            pkgutil --check-signature "$PKG" || { echo "::error::pkg signature check failed"; exit 1; }
          else
            echo "::warning::pkg unsigned (no signing identity configured)"
          fi

          if [ "$EXPECT_NOTARIZED" = "true" ]; then
            xcrun stapler validate "$PKG" || { echo "::error::pkg has no stapled notarization ticket"; exit 1; }
            spctl --assess --type install --verbose=4 "$PKG" || { echo "::error::Gatekeeper rejects this pkg"; exit 1; }
          else
            echo "::warning::pkg not notarized — Gatekeeper will block it on download"
          fi

          shasum -a 256 "$PKG" > "$PKG.sha256"; cat "$PKG.sha256"

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP"/*.p12 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-macos
          path: |
            _artifacts/*-macOS.pkg
            _artifacts/*-macOS.pkg.sha256
          retention-days: 7

  # --------------------------------------------------------------------------
  # pluginval (level >= validate): VST3 + AU at strictness 7, per OS, against
  # the raw bundles the build jobs uploaded. CLAP is validated by clapval-*.
  # --------------------------------------------------------------------------
  pluginval-linux:
    needs: [manifest, build-linux]
    if: >-
      always() && contains(fromJSON('["validate","full"]'), needs.manifest.outputs.level) &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Download raw plugin bundles
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-raw-linux
          path: artifacts
      - name: Install pluginval + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          curl -fsSL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip" -o pluginval.zip
          unzip -q pluginval.zip
          chmod +x pluginval
      - name: Validate plugins
        timeout-minutes: 15
        run: |
          chmod +x _generator/tools/ci/run_pluginval.sh
          _generator/tools/ci/run_pluginval.sh ./pluginval artifacts pluginval_logs 7
      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-pluginval-linux
          path: pluginval_logs/
          retention-days: 14

  pluginval-windows:
    needs: [manifest, build-windows]
    if: >-
      always() && contains(fromJSON('["validate","full"]'), needs.manifest.outputs.level) &&
      needs.build-windows.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Download raw plugin bundles
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-raw-windows
          path: artifacts
      - name: Install pluginval
        shell: bash
        run: |
          curl -fsSL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -o pluginval.zip
          unzip -q pluginval.zip
          chmod +x pluginval.exe
      - name: Validate plugins
        shell: bash
        timeout-minutes: 15
        run: |
          chmod +x _generator/tools/ci/run_pluginval.sh
          _generator/tools/ci/run_pluginval.sh ./pluginval.exe artifacts pluginval_logs 7
      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-pluginval-windows
          path: pluginval_logs/
          retention-days: 14

  pluginval-macos:
    needs: [manifest, build-macos]
    if: >-
      always() && contains(fromJSON('["validate","full"]'), needs.manifest.outputs.level) &&
      needs.build-macos.result == 'success'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Download raw plugin bundles
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-raw-macos
          path: artifacts
      - name: Register AU components
        run: |
          AU_DIR="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$AU_DIR"
          for comp in artifacts/*.component; do
            [ -e "$comp" ] || continue
            echo "Installing AU: $comp -> $AU_DIR/"
            cp -R "$comp" "$AU_DIR/"
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
      - name: Install pluginval
        run: |
          curl -fsSL "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip" -o pluginval.zip
          unzip -q pluginval.zip
      - name: Validate plugins
        timeout-minutes: 15
        run: |
          chmod +x _generator/tools/ci/run_pluginval.sh
          _generator/tools/ci/run_pluginval.sh pluginval.app/Contents/MacOS/pluginval artifacts pluginval_logs 7
      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-pluginval-macos
          path: pluginval_logs/
          retention-days: 14

  # --------------------------------------------------------------------------
  # clapval (level >= validate): CLAP validation via clap-validator, pinned
  # 0.3.2 (releases/latest is rate-limited unauthenticated on runner IPs).
  # --------------------------------------------------------------------------
  clapval-linux:
    needs: [manifest, build-linux]
    if: >-
      always() && contains(fromJSON('["validate","full"]'), needs.manifest.outputs.level) &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Download raw plugin bundles
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-raw-linux
          path: artifacts
      - name: Install clap-validator
        run: |
          VERSION=0.3.2
          curl -fsSL "https://github.com/free-audio/clap-validator/releases/download/${VERSION}/clap-validator-${VERSION}-ubuntu-18.04.tar.gz" -o clapval.tar.gz
          tar -xzf clapval.tar.gz
          chmod +x clap-validator
      - name: Validate CLAP plugins
        timeout-minutes: 15
        run: |
          chmod +x _generator/tools/ci/run_clapval.sh
          _generator/tools/ci/run_clapval.sh ./clap-validator artifacts clapval_logs
      - name: Upload clapval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-clapval-linux
          path: clapval_logs/
          retention-days: 14

  clapval-windows:
    needs: [manifest, build-windows]
    if: >-
      always() && contains(fromJSON('["validate","full"]'), needs.manifest.outputs.level) &&
      needs.build-windows.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Download raw plugin bundles
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-raw-windows
          path: artifacts
      - name: Install clap-validator
        shell: bash
        run: |
          VERSION=0.3.2
          curl -fsSL "https://github.com/free-audio/clap-validator/releases/download/${VERSION}/clap-validator-${VERSION}-windows.zip" -o clapval.zip
          unzip -q clapval.zip
          chmod +x clap-validator.exe
      - name: Validate CLAP plugins
        shell: bash
        timeout-minutes: 15
        run: |
          chmod +x _generator/tools/ci/run_clapval.sh
          _generator/tools/ci/run_clapval.sh ./clap-validator.exe artifacts clapval_logs
      - name: Upload clapval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-clapval-windows
          path: clapval_logs/
          retention-days: 14

  clapval-macos:
    needs: [manifest, build-macos]
    if: >-
      always() && contains(fromJSON('["validate","full"]'), needs.manifest.outputs.level) &&
      needs.build-macos.result == 'success'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Download raw plugin bundles
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-raw-macos
          path: artifacts
      - name: Install clap-validator
        run: |
          VERSION=0.3.2
          curl -fsSL "https://github.com/free-audio/clap-validator/releases/download/${VERSION}/clap-validator-${VERSION}-macos-universal.tar.gz" -o clapval.tar.gz
          mkdir clapval && tar -xzf clapval.tar.gz -C clapval
          # Tarball layout varies by release (0.3.2 nests the binary under binaries/)
          BIN=$(find clapval -name clap-validator -type f | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "$PWD/$(dirname "$BIN")" >> "$GITHUB_PATH"
      - name: Validate CLAP plugins
        timeout-minutes: 15
        run: |
          chmod +x _generator/tools/ci/run_clapval.sh
          _generator/tools/ci/run_clapval.sh clap-validator artifacts clapval_logs
      - name: Upload clapval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-clapval-macos
          path: clapval_logs/
          retention-days: 14

  # --------------------------------------------------------------------------
  # Sanitizers (level=full, Linux): asan / tsan / ubsan over the test suite.
  # Needs the plugin's CMake to expose the sanitizer cache var (manifest
  # sanitizer_flag); suppression files are picked up when the repo ships them.
  # --------------------------------------------------------------------------
  sanitizers-linux:
    needs: [manifest, lint]
    if: >-
      always() && needs.manifest.outputs.level == 'full' &&
      needs.manifest.outputs.has_tests == 'true' &&
      needs.manifest.outputs.sanitizer_flag != '' &&
      needs.lint.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan, ubsan]
    defaults:
      run:
        working-directory: ${{ needs.manifest.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/${{ needs.manifest.outputs.repo_name }}
          ref: ${{ needs.manifest.outputs.ref }}
          path: ${{ needs.manifest.outputs.repo_name }}
          submodules: recursive
          token: ${{ secrets.PAT }}
      - name: Clone PluginTemplate (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/PluginTemplate
          path: PluginTemplate
          submodules: recursive
          token: ${{ secrets.PAT }}
      # Shared GUI base (look/ + display/DirektCurveEditor) — the spectral lineup
      # resolves ../DirektDSP_GUI as a sibling; cheap no-op for plugins that
      # don't reference it, so it rides the same gate as PluginTemplate.
      - name: Clone DirektDSP_GUI (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/DirektDSP_GUI
          path: DirektDSP_GUI
          token: ${{ secrets.PAT }}
      - name: Probe for sanitizer support
        id: probe
        env:
          SANITIZER_FLAG: ${{ needs.manifest.outputs.sanitizer_flag }}
        run: |
          if grep -q "$SANITIZER_FLAG" CMakeLists.txt 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CMakeLists has no $SANITIZER_FLAG — skipping sanitizer build"
          fi
      - name: Install deps
        if: steps.probe.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build jq \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxfixes-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libcurl4-openssl-dev \
            ladspa-sdk libgl1-mesa-dev llvm
      - name: Configure
        if: steps.probe.outputs.found == 'true'
        env:
          DISABLE_FLAG: ${{ needs.manifest.outputs.disable_moonbase_flag }}
          SANITIZER_FLAG: ${{ needs.manifest.outputs.sanitizer_flag }}
        run: |
          # ubsan maps to the same CMake flavour as asan (combined build) but
          # runs with a UB-focused runtime filter.
          SANITIZER="${{ matrix.sanitizer }}"
          [[ "$SANITIZER" == "ubsan" ]] && SANITIZER="asan"
          cmake -B build-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            ${DISABLE_FLAG:+-D${DISABLE_FLAG}=ON} \
            -D${SANITIZER_FLAG}=$SANITIZER
      - name: Build Tests target
        if: steps.probe.outputs.found == 'true'
        # catch_discover_tests runs the freshly-linked Tests binary POST_BUILD
        # to enumerate test cases. Under ASan that discovery run has LSan
        # enabled but no suppressions loaded, so known one-shot static-init
        # leaks (see each repo's .github/sanitizer/lsan.supp) abort discovery
        # and fail the build target. Leak detection is pointless during
        # --list-tests; the "Run ctest" step below re-enables it WITH the
        # suppression files.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --build build-sanitizer --config Debug --target Tests
      - name: Run ctest under ${{ matrix.sanitizer }}
        if: steps.probe.outputs.found == 'true'
        env:
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer
        run: |
          set -o pipefail
          mkdir -p sanitizer-logs
          # Suppression files are optional per plugin
          SUPP="$PWD/.github/sanitizer"
          ASAN_OPTIONS="detect_leaks=1:halt_on_error=1:abort_on_error=0:strict_string_checks=1:detect_stack_use_after_return=1"
          LSAN_OPTIONS="print_suppressions=0"
          [ -f "$SUPP/lsan.supp" ] && LSAN_OPTIONS="suppressions=$SUPP/lsan.supp:$LSAN_OPTIONS"
          UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          [ -f "$SUPP/ubsan.supp" ] && UBSAN_OPTIONS="$UBSAN_OPTIONS:suppressions=$SUPP/ubsan.supp"
          TSAN_OPTIONS="halt_on_error=0:exitcode=0:second_deadlock_stack=1"
          [ -f "$SUPP/tsan.supp" ] && TSAN_OPTIONS="$TSAN_OPTIONS:suppressions=$SUPP/tsan.supp"
          export ASAN_OPTIONS LSAN_OPTIONS UBSAN_OPTIONS TSAN_OPTIONS

          if [ "${{ matrix.sanitizer }}" = "tsan" ]; then
            ctest --test-dir build-sanitizer --output-on-failure -C Debug -E "Benchmarks" 2>&1 | tee sanitizer-logs/tsan.log
            if grep -q "ThreadSanitizer:" sanitizer-logs/tsan.log; then
              echo "::warning::TSAN reported one or more races — review sanitizer-logs/tsan.log"
            fi
          elif [ "${{ matrix.sanitizer }}" = "ubsan" ]; then
            ASAN_OPTIONS="detect_leaks=0:halt_on_error=0" \
            ctest --test-dir build-sanitizer --output-on-failure -C Debug -E "Benchmarks" 2>&1 | tee sanitizer-logs/ubsan.log
            if grep -q "runtime error:" sanitizer-logs/ubsan.log; then
              echo "::error::UBSAN reported undefined behaviour — review sanitizer-logs/ubsan.log"
              exit 1
            fi
          else
            ctest --test-dir build-sanitizer --output-on-failure -C Debug -E "Benchmarks" 2>&1 | tee sanitizer-logs/asan.log
          fi
      - name: Upload sanitizer logs
        if: always() && steps.probe.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-sanitizer-${{ matrix.sanitizer }}-logs
          path: ${{ needs.manifest.outputs.repo_name }}/sanitizer-logs/
          retention-days: 14

  # --------------------------------------------------------------------------
  # Coverage (level=full, Linux, gcov/lcov). Source-only, UI excluded (no
  # headless test path); warns under the 80% line target.
  # --------------------------------------------------------------------------
  coverage:
    needs: [manifest, lint]
    if: >-
      always() && needs.manifest.outputs.level == 'full' &&
      needs.manifest.outputs.has_tests == 'true' &&
      needs.lint.result != 'cancelled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.manifest.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/${{ needs.manifest.outputs.repo_name }}
          ref: ${{ needs.manifest.outputs.ref }}
          path: ${{ needs.manifest.outputs.repo_name }}
          submodules: recursive
          token: ${{ secrets.PAT }}
      - name: Clone PluginTemplate (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/PluginTemplate
          path: PluginTemplate
          submodules: recursive
          token: ${{ secrets.PAT }}
      # Shared GUI base (look/ + display/DirektCurveEditor) — the spectral lineup
      # resolves ../DirektDSP_GUI as a sibling; cheap no-op for plugins that
      # don't reference it, so it rides the same gate as PluginTemplate.
      - name: Clone DirektDSP_GUI (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/DirektDSP_GUI
          path: DirektDSP_GUI
          token: ${{ secrets.PAT }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build lcov \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxfixes-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libcurl4-openssl-dev \
            ladspa-sdk libgl1-mesa-dev
      - name: Configure with coverage flags
        env:
          DISABLE_FLAG: ${{ needs.manifest.outputs.disable_moonbase_flag }}
        run: |
          # -fprofile-update=atomic: JUCE tests spin real threads (message
          # thread, audio workers); non-atomic gcov counters race and go
          # negative, which geninfo treats as a hard error at capture time.
          cmake -B build-cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            ${DISABLE_FLAG:+-D${DISABLE_FLAG}=ON} \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage -fprofile-update=atomic -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build Tests
        run: cmake --build build-cov --target Tests
      - name: Run tests
        run: ctest --test-dir build-cov --output-on-failure -C Debug -E "Benchmarks"
      - name: Capture + filter coverage (lcov)
        run: |
          # negative: residual racy counters (third-party TUs built without
          # atomic updates) should degrade the numbers, not kill the job.
          lcov --capture --directory build-cov --output-file coverage.info \
            --ignore-errors mismatch,source,negative
          lcov --extract coverage.info "*/${{ needs.manifest.outputs.repo_name }}/source/*" \
            --output-file coverage_src.info --ignore-errors unused,source
          # Drop UI and editor (no headless test path)
          lcov --remove coverage_src.info '*/source/UI/*' '*/source/PluginEditor*' \
            --output-file coverage_filtered.info --ignore-errors unused,source
      - name: Generate HTML report
        run: genhtml coverage_filtered.info --output-directory coverage-report --ignore-errors source
      - name: Print coverage summary
        run: |
          lcov --summary coverage_filtered.info 2>&1 | tee coverage-summary.txt
          LINES=$(grep -oP 'lines\.*: \K[0-9.]+' coverage-summary.txt | head -1)
          echo "Line coverage: ${LINES}%"
          if [ -n "$LINES" ] && (( $(echo "$LINES < 80.0" | bc -l) )); then
            echo "::warning::Line coverage ${LINES}% is below the 80% target"
          fi
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-coverage
          path: ${{ needs.manifest.outputs.repo_name }}/coverage-report/
          retention-days: 30

  # --------------------------------------------------------------------------
  # Benchmarks (level=full, Linux): timing artifact for trend tracking.
  # Skips (with a notice) when the plugin registers no Benchmarks tests.
  # --------------------------------------------------------------------------
  benchmarks-linux:
    needs: [manifest, lint]
    if: >-
      always() && needs.manifest.outputs.level == 'full' &&
      needs.manifest.outputs.has_tests == 'true' &&
      needs.lint.result != 'cancelled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.manifest.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4
        with: { path: _generator }
      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/${{ needs.manifest.outputs.repo_name }}
          ref: ${{ needs.manifest.outputs.ref }}
          path: ${{ needs.manifest.outputs.repo_name }}
          submodules: recursive
          token: ${{ secrets.PAT }}
      - name: Clone PluginTemplate (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/PluginTemplate
          path: PluginTemplate
          submodules: recursive
          token: ${{ secrets.PAT }}
      # Shared GUI base (look/ + display/DirektCurveEditor) — the spectral lineup
      # resolves ../DirektDSP_GUI as a sibling; cheap no-op for plugins that
      # don't reference it, so it rides the same gate as PluginTemplate.
      - name: Clone DirektDSP_GUI (sibling, if required)
        if: needs.manifest.outputs.needs_plugin_template == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest.outputs.company_name }}/DirektDSP_GUI
          path: DirektDSP_GUI
          token: ${{ secrets.PAT }}
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxfixes-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libcurl4-openssl-dev \
            ladspa-sdk libgl1-mesa-dev
      - name: Build + run benchmarks
        env:
          DISABLE_FLAG: ${{ needs.manifest.outputs.disable_moonbase_flag }}
        run: |
          cmake -B build-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${DISABLE_FLAG:+-D${DISABLE_FLAG}=ON}
          COUNT=$(ctest --test-dir build-bench -N -R "Benchmarks" 2>/dev/null | awk '/Total Tests:/ {print $3}')
          if [ "${COUNT:-0}" = "0" ]; then
            echo "::notice::plugin registers no Benchmarks tests — skipping"
            exit 0
          fi
          cmake --build build-bench --config Release --target Benchmarks
          mkdir -p benchmark-results
          ctest --test-dir build-bench --output-on-failure -C Release -R "Benchmarks" \
            -D ExtraVerbose 2>&1 | tee benchmark-results/results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.manifest.outputs.slug }}-benchmarks
          path: ${{ needs.manifest.outputs.repo_name }}/benchmark-results/
          retention-days: 90
          if-no-files-found: ignore
