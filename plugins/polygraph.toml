schema_version = "1"

[repo]
name = "Polygraph"
# Pinned to the commit 1.0.0 ships from (Polygraph master, 2026-11-09): the
# v1.0.0 tag (2026-10-20) predates the Logic MIDI input, the double-trigger
# and re-pluck fixes and the final manual, and was never sold. Go back to a
# tag ref ("vX.Y.Z") with the next tagged release; a v* ref also makes every
# level build the manual.
# 1.0.0 is the first public release (1.1.x tags were removed on 2026-10-20).
ref  = "402d162ddd6dfb3a2e1387ae85482829157d097b"

[identity]
product_name = "Polygraph"
company_name = "DirektDSP"
bundle_id    = "com.direktdsp.polygraph"
description  = "real-time polyphonic guitar to MIDI"
tagline      = "Polygraph — real-time polyphonic guitar to MIDI."
trial_days   = 7
website      = "https://direktdsp.com"

[formats]
windows = ["VST3", "CLAP", "Standalone"]
macos   = ["VST3", "AU", "CLAP", "Standalone"]
linux   = ["VST3", "CLAP", "Standalone"]

[build]
system                = "cmake"
build_dir             = "build"
artefacts_subdir      = "Polygraph_artefacts"
needs_plugin_template = true
disable_moonbase_flag = "POLYGRAPH_DISABLE_MOONBASE"
config_secret         = "POLYGRAPH_CONFIG_B64"

[build.targets]
VST3       = "Polygraph_VST3"
CLAP       = "Polygraph_CLAP"
AU         = "Polygraph_AU"
Standalone = "Polygraph_Standalone"

# ONNX Runtime ships beside the single-file formats (the .clap and the standalone
# binary), so the neural engine isn't silently lost. The VST3 bundle already carries
# it inside the bundle; macOS bundles carry it in Contents/Frameworks.
[runtime_files]
windows = ["onnxruntime.dll", "Licenses"]
linux   = ["libonnxruntime.so.1.23.2", "Licenses"]

[assets]
icon_ico    = "packaging/icon.ico"
icon_png    = "packaging/icon.png"
header_bmp  = "packaging/header.bmp"
welcome_bmp = "packaging/welcome.bmp"
