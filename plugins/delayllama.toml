# InstallerGenerator manifest for DelayLlama — written by scripts/new_plugin.py to
# InstallerGenerator/plugins/delayllama.toml. That copy is the single source
# of truth for installer copy text (description/tagline) and the catalog; keep
# it in sync on every release-affecting change (see /release-plugin).
schema_version = "1"

[repo]
name = "Delay-Llama"
ref  = ""

[identity]
product_name = "DelayLlama"
company_name = "DirektDSP"
bundle_id    = "com.direktdsp.delayllama"
description  = "FOF granular formant choir synthesiser"
tagline      = "A choir of llamas, chanting"
trial_days   = 14
website      = "https://direktdsp.com"

[formats]
windows = ["VST3", "CLAP", "Standalone"]
macos   = ["VST3", "AU", "CLAP", "Standalone"]
linux   = ["VST3", "CLAP", "Standalone"]

[build]
system                = "cmake"
build_dir             = "build"
artefacts_subdir      = "DelayLlama_artefacts"
needs_plugin_template = true
disable_moonbase_flag = "DELAYLLAMA_DISABLE_MOONBASE"
config_secret         = "DELAYLLAMA_CONFIG_B64"

[build.targets]
VST3       = "DelayLlama_VST3"
CLAP       = "DelayLlama_CLAP"
AU         = "DelayLlama_AU"
Standalone = "DelayLlama_Standalone"

[assets]
icon_ico    = "packaging/icon.ico"
icon_png    = "packaging/icon.png"
header_bmp  = "packaging/header.bmp"
welcome_bmp = "packaging/welcome.bmp"
