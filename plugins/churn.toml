schema_version = "1"

[repo]
name = "Churn"
# Pinned to the released tag, not the default branch. The catalog is what the
# website links to, so a nightly built from master would hand visitors
# unreleased work under a released version number. Bump this when you tag.
ref  = "v1.0.1"

[identity]
product_name = "Churn"
company_name = "DirektDSP"
bundle_id    = "com.direktdsp.churn"
# Was mislabelled "polyphonic guitar-to-MIDI plugin" in the copied NSIS script —
# fixed here as the single source of truth.
description  = "modulation plugin — phaser, flanger, comb bank and phase rotation in two stackable FX engines"
tagline      = "Churn — make your sounds seasick."
trial_days   = 14
website      = "https://direktdsp.com"

# Standalone was removed from Churn's project.toml formats (285ef73), so it is
# neither built nor distributed. Every other Churn surface reads VST3 / AU / CLAP.
[formats]
windows = ["VST3", "CLAP"]
macos   = ["VST3", "AU", "CLAP"]
linux   = ["VST3", "CLAP"]

[build]
system                = "cmake"
build_dir             = "build"
artefacts_subdir      = "Churn_artefacts"
needs_plugin_template = true
disable_moonbase_flag = "CHURN_DISABLE_MOONBASE"
config_secret         = "CHURN_CONFIG_B64"

[build.targets]
VST3       = "Churn_VST3"
CLAP       = "Churn_CLAP"
AU         = "Churn_AU"

[assets]
icon_ico    = "packaging/icon.ico"
icon_png    = "packaging/icon.png"
header_bmp  = "packaging/header.bmp"
welcome_bmp = "packaging/welcome.bmp"
